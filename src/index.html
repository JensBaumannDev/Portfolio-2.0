<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Jens Baumann — Junior Fullstack Developer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Jens Baumann — Junior Fullstack Developer aus Emden, Ostfriesland. Quereinsteiger mit Angular, TypeScript und SCSS. Offen für Praktikum, Werkstudium oder eine Junior-Rolle ab Q4 2026."
    />
    <link rel="preload" href="/fonts/Signika.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="favicon-dark.svg?v=2" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon-light.svg?v=2" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);

        if (document.fonts && document.fonts.load) {
          document.fonts.load('700 16px Signika');
        }
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
