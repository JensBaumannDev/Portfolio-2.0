<div class="work content-container">
  <header class="work-header" appReveal>
    <h2 class="work-title">{{ 'projects.title' | translate }}<span class="work-title-dot">.</span></h2>
    <p class="work-sub">{{ 'projects.subtitle' | translate }}</p>
  </header>

  <div class="work-grid" appRevealStagger revealSelector=".work-card">
    @for (project of projects(); track project.key) {
      <article class="work-card">
        <button
          type="button"
          class="work-card-visual"
          (click)="openDialog(project.key)"
          [attr.aria-label]="('projects.' + project.key + '.name' | translate) + ' — ' + ('projects.detail_cta' | translate)"
        >
          <span class="work-card-visual-inner">
            <img [ngSrc]="project.image" fill [alt]="project.imageAlt" sizes="(max-width: 768px) 90vw, 33vw" />
          </span>
        </button>

        <div class="work-card-body">
          <h3 class="work-card-name">{{ 'projects.' + project.key + '.name' | translate }}</h3>
          <a class="work-card-link" [href]="project.live" target="_blank" rel="noopener">
            {{ 'projects.live_cta' | translate }}
          </a>
        </div>
      </article>
    }
  </div>
</div>

@if (selectedProject(); as project) {
  <app-project-dialog [project]="project" (close)="closeDialog()" (next)="nextProject()" />
}
