<section class="hero" aria-labelledby="hero-title">
  <div class="content-container hero-inner">
    <div class="hero-copy">
      <div class="hero-heading">
        <p class="eyebrow">JENS BAUMANN</p>
        <p class="hero-role">{{ 'portfolio.hero.role' | translate }}</p>
        <h1 id="hero-title"><span [innerHTML]="'portfolio.hero.slogan' | translate"></span><span
            class="title-dot">.</span></h1>
        <p class="intro">{{ 'portfolio.hero.intro' | translate }}</p>
      </div>
      <div class="hero-details">
        <p class="availability">{{ 'portfolio.hero.availability' | translate }}</p>
        <div class="hero-actions">
          <a class="button button-light" href="#contact">{{ 'portfolio.hero.talk' | translate }}</a>
          <a class="button button-light" href="#projects">{{ 'portfolio.hero.work' | translate }}</a>
          <a class="button button-light button-cv" [href]="cvUrl" download>{{ 'portfolio.hero.cv' |
            translate }} <ng-icon name="lucideDownload" size="1.15em" aria-hidden="true"></ng-icon></a>
        </div>
      </div>
    </div>
    <div class="hero-visual">
      <img ngSrc="/img/about/jens-baumann-about-cutout.png" fill priority [alt]="'hero.profile_alt' | translate" />
    </div>
    <div class="hero-footer">
      <nav class="hero-socials" aria-label="Social links">
        <a href="https://github.com/JensBaumannDev" target="_blank" rel="noopener"><ng-icon name="faBrandGithub"
            size="1.4em" aria-hidden="true"></ng-icon><span>GitHub</span></a>
        <a href="https://www.linkedin.com/in/jens-baumann-7a6866315/" target="_blank" rel="noopener"><ng-icon
            name="faBrandLinkedinIn" size="1.4em" aria-hidden="true"></ng-icon><span>LinkedIn</span></a>
        <a href="https://www.youtube.com/@jensbaumann_music" target="_blank" rel="noopener"><ng-icon
            name="faBrandYoutube" size="1.4em" aria-hidden="true"></ng-icon><span>YouTube</span></a>
      </nav>
    </div>
  </div>
</section>
